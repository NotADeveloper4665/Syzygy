name: Syzygy Linux build and key checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libcap-dev libcurl4-openssl-dev \
            libdrm-dev libevdev-dev libgbm-dev libminiupnpc-dev libnotify-dev libnuma-dev libopus-dev \
            libpulse-dev libssl-dev libva-dev libwayland-dev libx11-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb1-dev libxfixes-dev libxrandr-dev libxtst-dev
      - name: Test CLI and protected key storage
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc src/syzygy/cli.cpp src/syzygy/key_store.cpp \
            tests/syzygy_smoke.cpp -lcrypto -pthread -o syzygy-smoke
          ./syzygy-smoke
      - name: Configure and build host and compatibility web assets
        env:
          BRANCH: main
          BUILD_VERSION: '0.1.0'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ENABLE_CUDA=OFF -DSUNSHINE_ENABLE_TRAY=OFF -DBUILD_TESTS=OFF \
            -DSUNSHINE_ASSETS_DIR_DEF=assets
          cmake --build build --parallel 2
      - name: Check standalone key output without starting streaming
        working-directory: build
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          trap 'rm -rf "$XDG_CONFIG_HOME"' EXIT
          ./syzygy --help | grep -F -- '-psk'
          ./syzygy -psk > "$XDG_CONFIG_HOME/key-first" 2> "$XDG_CONFIG_HOME/diagnostics"
          ./syzygy -psk > "$XDG_CONFIG_HOME/key-second" 2>> "$XDG_CONFIG_HOME/diagnostics"
          python3 - <<'PY'
          import os, pathlib, re, stat
          root = pathlib.Path(os.environ['XDG_CONFIG_HOME'])
          first = (root / 'key-first').read_bytes()
          assert re.fullmatch(rb'[0-9a-f]{48}\n', first), 'stdout must contain exactly one key'
          assert first == (root / 'key-second').read_bytes(), 'key must persist'
          assert first.strip() not in (root / 'diagnostics').read_bytes(), 'diagnostics must not reveal the key'
          assert stat.S_IMODE((root / 'sunshine/syzygy/syzygy.psk').stat().st_mode) == 0o600
          print('PASS: standalone key output, persistence, and redaction')
          PY
      - name: Archive development binary and runtime assets
        run: tar -C build -czhf syzygy-linux-x86_64-development.tar.gz syzygy assets
      - uses: actions/upload-artifact@v4
        with:
          name: Syzygy-Linux-x86_64-development
          path: syzygy-linux-x86_64-development.tar.gz
