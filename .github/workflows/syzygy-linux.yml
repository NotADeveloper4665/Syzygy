name: Syzygy Linux build and key checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev ripgrep kmod
      - name: Prepare virtual DRM device for displayless capture tests
        run: |
          if ! sudo modprobe vgem; then
            sudo apt-get install -y "linux-headers-$(uname -r)"
            kernel_series="$(uname -r | cut -d. -f1,2)"
            module_dir="$(mktemp -d)"
            for source in vgem_drv.c vgem_drv.h vgem_fence.c; do
              curl -fsSL "https://raw.githubusercontent.com/torvalds/linux/v$kernel_series/drivers/gpu/drm/vgem/$source" -o "$module_dir/$source"
            done
            printf 'obj-m := vgem.o\nvgem-y := vgem_drv.o vgem_fence.o\n' > "$module_dir/Makefile"
            if ! sudo modprobe drm_shmem_helper; then
              curl -fsSL "https://raw.githubusercontent.com/torvalds/linux/v$kernel_series/drivers/gpu/drm/drm_gem_shmem_helper.c" -o "$module_dir/drm_gem_shmem_helper.c"
              printf 'obj-m += drm_shmem_helper.o\ndrm_shmem_helper-y := drm_gem_shmem_helper.o\n' >> "$module_dir/Makefile"
            fi
            make -C "/lib/modules/$(uname -r)/build" M="$module_dir" modules
            sudo install -d "/lib/modules/$(uname -r)/extra"
            sudo install -m 0644 "$module_dir"/*.ko "/lib/modules/$(uname -r)/extra/"
            sudo depmod -a
            sudo modprobe vgem
          fi
          virtual_card=""
          for card in /sys/class/drm/card[0-9]*; do
            [ -f "$card/device/uevent" ] || continue
            if [[ "$(basename "$(readlink -f "$card/device")")" == vgem* ]] || rg -q '^DRIVER=vgem$' "$card/device/uevent" || [ "$(basename "$(readlink -f "$card/device/driver/module")")" = vgem ]; then
              virtual_card="/dev/dri/$(basename "$card")"
              break
            fi
          done
          [ -n "$virtual_card" ] || { ls -l /sys/class/drm /dev/dri; echo "No vgem DRM card found" >&2; exit 1; }
          sudo chmod 0666 "$virtual_card"
          echo "VGEM_DRM_CARD=$virtual_card" >> "$GITHUB_ENV"
      - name: Test CLI and protected key storage
        run: |
          bash -n scripts/install-syzygy.sh
          python3 -m unittest discover -s tests -p "test_headless_launcher.py"
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc src/syzygy/cli.cpp src/syzygy/key_store.cpp src/syzygy/pairing_auth.cpp \
            tests/syzygy_smoke.cpp -lcrypto -pthread -o syzygy-smoke
          ./syzygy-smoke
      - name: Build RPM package
        env:
          RELEASE_VERSION: '0.0.7'
        run: |
          docker run --rm --cap-add SYS_NICE --device /dev/dri:/dev/dri -e CI=1 -e SYZYGY_CI_VGEM_CARD="$VGEM_DRM_CARD" -e BUILD_VERSION="$RELEASE_VERSION" -e BRANCH=main -e COMMIT="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/src" -w /src fedora:44 bash -euc '
              dnf install -y @development-tools gcc-c++ cmake ninja-build pkgconf-pkg-config rpm-build nodejs npm git curl wget which \
                libcap-devel libcurl-devel libdrm-devel libevdev-devel libgudev-devel libnotify-devel libva-devel \
                glib2-devel pipewire-devel \
                libX11-devel libxcb-devel libXcursor-devel libXfixes-devel libXi-devel libXinerama-devel \
                libXrandr-devel libXtst-devel mesa-libGL-devel mesa-libgbm-devel miniupnpc-devel numactl-devel \
                openssl-devel opus-devel pulseaudio-libs-devel systemd-udev systemd-rpm-macros desktop-file-utils \
                libappstream-glib wayland-devel kwin-wayland plasma-workspace xorg-x11-server-Xwayland \
                pipewire pipewire-pulseaudio wireplumber pulseaudio-utils dbus-daemon python3 mesa-dri-drivers
              # Older libdrm cannot enumerate vgem on the faux bus. KWin has a
              # CI workaround that opens card1; alias only this virtual test device.
              if [ "$SYZYGY_CI_VGEM_CARD" != /dev/dri/card1 ] && [ ! -e /dev/dri/card1 ]; then
                ln -s "$SYZYGY_CI_VGEM_CARD" /dev/dri/card1
              fi
              mkdir -p /tmp/headless-protocols
              for protocol in zkde-screencast-unstable-v1 fake-input; do
                wayland-scanner client-header /src/protocols/$protocol.xml /tmp/headless-protocols/$protocol.h
                wayland-scanner private-code /src/protocols/$protocol.xml /tmp/headless-protocols/$protocol.c
              done
              gcc -c /tmp/headless-protocols/zkde-screencast-unstable-v1.c /tmp/headless-protocols/fake-input.c $(pkg-config --cflags wayland-client)
              g++ -std=c++17 -Isrc -I/tmp/headless-protocols tests/headless_capture_smoke.cpp \
                zkde-screencast-unstable-v1.o fake-input.o $(pkg-config --cflags --libs wayland-client libpipewire-0.3) \
                -pthread -o /tmp/headless-capture-smoke
              useradd -m syzygy-ci
              timeout 90s runuser -u syzygy-ci -- env SYZYGY_HEADLESS_SIZE=640x480 LIBGL_ALWAYS_SOFTWARE=1 QT_LOGGING_RULES="kwin_core.debug=true;KWIN_UTILS.debug=true" \
                python3 /src/src_assets/linux/assets/scripts/syzygy-headless.py --binary /tmp/headless-capture-smoke
              cmake -S /src -B /src/build-fedora -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr -DSUNSHINE_ENABLE_CUDA=OFF -DSUNSHINE_ENABLE_TRAY=OFF -DBUILD_TESTS=OFF \
                -DSUNSHINE_ASSETS_DIR=/usr/share/syzygy -DSUNSHINE_EXECUTABLE_PATH=/usr/bin/syzygy
              cmake --build /src/build-fedora --parallel 2
              cpack --config /src/build-fedora/CPackConfig.cmake -G RPM
              dnf install -y /src/build-fedora/cpack_artifacts/*.rpm
              python3 /src/scripts/check-installed-assets.py
              python3 /src/scripts/check-passkey-pairing.py
              timeout 90s runuser -u syzygy-ci -- env LIBGL_ALWAYS_SOFTWARE=1 \
                python3 /src/scripts/check-headless-startup.py
              mkdir -p /src/installed-layout/usr/bin /src/installed-layout/usr/share
              cp /usr/bin/syzygy /src/installed-layout/usr/bin/
              cp -a /usr/share/syzygy /src/installed-layout/usr/share/
              cd /src/build-fedora
              bash /src/scripts/check-syzygy-key.sh
            '
      - name: Upload RPM build artifact
        uses: actions/upload-artifact@v4
        with:
          name: syzygy-rpm
          path: build-fedora/cpack_artifacts/*.rpm
          if-no-files-found: error
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release v0.0.7'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.7' }}
          target_commitish: ${{ github.sha }}
          name: Syzygy ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.7' }}
          generate_release_notes: true
          files: build-fedora/cpack_artifacts/*.rpm
      - name: Archive installed binary and runtime assets
        run: tar -C installed-layout -czf syzygy-linux-x86_64-installed-layout.tar.gz usr
      - uses: actions/upload-artifact@v4
        with:
          name: Syzygy-Linux-x86_64-installed-layout
          path: syzygy-linux-x86_64-installed-layout.tar.gz
