name: Publish Syzygy development RPM
on:
  workflow_run:
    workflows: ['Syzygy Linux build and key checks']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/syzygy-dev-rpm.yml', 'scripts/publish-syzygy-dev-rpm.sh']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: syzygy-development-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish the newest validated main RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/syzygy-linux.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs | map(select(.event != "pull_request" and .head_repository.full_name == "NotADeveloper4665/Syzygy")) | first | .id')"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No successful main RPM build exists yet." >&2; exit 1; }
          export SYZYGY_DEV_RUN="$run_id"
          export SYZYGY_DEV_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)"
          mkdir -p dev-package
          gh run download "$run_id" --name syzygy-rpm --dir dev-package
          bash scripts/publish-syzygy-dev-rpm.sh dev-package/Syzygy.rpm
